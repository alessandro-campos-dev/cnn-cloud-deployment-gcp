apiVersion: v1
kind: ConfigMap
metadata:
  name: cnn-classifier-config
  namespace: default
data:
  model.class_names: "airplane,automobile,bird,cat,deer,dog,frog,horse,ship,truck"
  app.log_level: "INFO"
  app.max_file_size: "5MB"
  app.allowed_extensions: ".jpg,.jpeg,.png,.gif"
  app.temp_folder: "/tmp/uploads"
  gcp.project_id: "YOUR_PROJECT_ID"
  gcp.region: "southamerica-east1"