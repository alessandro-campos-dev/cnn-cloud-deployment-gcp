# Application Configuration
app:
  name: "CNN Image Classifier"
  version: "1.0.0"
  debug: false
  host: "0.0.0.0"
  port: 8080
  workers: 1
  timeout: 300
  max_file_size: 5242880  # 5MB in bytes
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".bmp"

# Model Configuration
model:
  name: "cifar10-cnn"
  input_shape: [32, 32, 3]
  num_classes: 10
  class_names:
    - "airplane"
    - "automobile"
    - "bird"
    - "cat"
    - "deer"
    - "dog"
    - "frog"
    - "horse"
    - "ship"
    - "truck"
  model_path: "src/cnn-model/saved_models/cifar10_model.keras"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
  max_size: 10485760  # 10MB
  backup_count: 5

# Monitoring
monitoring:
  enabled: true
  metrics_port: 9090
  health_check_path: "/health"
  metrics_path: "/metrics"